<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="dsh-download-dock — live download cards for DeepSeek Harness">
  <title>dsh-download-dock</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080f"/>
      <stop offset="0.55" stop-color="#0b0b16"/>
      <stop offset="1" stop-color="#12101f"/>
    </linearGradient>
    <radialGradient id="haloA" cx="0.16" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#6d4aff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloB" cx="0.88" cy="0.78" r="0.52">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#e4dcff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fafb"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <style>
      .mono { font-family: "Cascadia Mono", "JetBrains Mono", Consolas, "SFMono-Regular", monospace; }
      .sans { font-family: "Segoe UI Semibold", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
      .chip { font-family: "Cascadia Mono", "JetBrains Mono", Consolas, monospace; font-size: 12.5px; letter-spacing: 0.4px; fill: #c4bedf; }
    </style>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#haloA)"/>
  <rect width="1280" height="340" fill="url(#haloB)"/>

  <!-- 右侧 HUD 装饰 -->
  <g fill="none" stroke="#7c5cff" stroke-opacity="0.16">
    <circle cx="1080" cy="168" r="196"/>
    <circle cx="1080" cy="168" r="238" stroke-opacity="0.09"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.07">
    <path d="M762 64V276"/>
  </g>
  <path d="M762 44h20M762 296h20" stroke="#8b5cf6" stroke-opacity="0.45"/>

  <!-- 左：品牌区 -->
  <g>
    <rect x="64" y="40" width="286" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="80" cy="53" r="3.5" fill="#a78bfa"/>
    <text x="92" y="57.5" class="mono" font-size="10.5" letter-spacing="2.2" fill="#b9b3d4">DEEPSEEK HARNESS · PLUGIN</text>

    <text x="64" y="140" class="mono" font-size="68" font-weight="700" letter-spacing="-2.5" fill="#7c5cff" fill-opacity="0.38" filter="url(#softglow)">dsh-download-dock</text>
    <text x="64" y="140" class="mono" font-size="68" font-weight="700" letter-spacing="-2.5" fill="url(#title)">dsh-download-dock</text>

    <text x="66" y="184" class="sans" font-size="25" font-weight="600" fill="#dedbf0">后台下载，看得见的每一字节</text>
    <text x="66" y="212" class="mono" font-size="13" fill="#8f8ba8">bytes · speed · ETA · right in the corner of the UI</text>

    <g>
      <rect x="66" y="238" width="52" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="92" y="255" class="chip" text-anchor="middle">git</text>
      <rect x="124" y="238" width="52" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="150" y="255" class="chip" text-anchor="middle">pip</text>
      <rect x="182" y="238" width="58" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="211" y="255" class="chip" text-anchor="middle">npm</text>
      <rect x="246" y="238" width="62" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="277" y="255" class="chip" text-anchor="middle">curl</text>
      <rect x="314" y="238" width="74" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="351" y="255" class="chip" text-anchor="middle">aria2c</text>
      <rect x="394" y="238" width="62" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="425" y="255" class="chip" text-anchor="middle">wget</text>
      <rect x="462" y="238" width="88" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="506" y="255" class="chip" text-anchor="middle">docker</text>
      <rect x="556" y="238" width="86" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="599" y="255" class="chip" text-anchor="middle">winget</text>
    </g>

    <text x="66" y="306" class="mono" font-size="11" letter-spacing="0.6" fill="#7b7794">MIT · node ≥ 20 · dsh ≥ 0.2.0-rc.1 · github.com/imnotRiv3r/dsh-download-dock</text>
  </g>

  <!-- 右：卡片示意 -->
  <g>
    <rect x="1092" y="42" width="70" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle cx="1106" cy="53" r="3" fill="#22d3ee"/>
    <text x="1115" y="57" class="mono" font-size="10" letter-spacing="1.6" fill="#7dd3fc">LIVE</text>

    <g filter="url(#cardShadow)">
      <rect x="806" y="76" width="410" height="188" rx="18" fill="#17161f" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.12"/>
    </g>
    <rect x="806" y="76" width="410" height="52" rx="18" fill="#ffffff" fill-opacity="0.02"/>
    <path d="M806 128h410" stroke="#ffffff" stroke-opacity="0.06"/>

    <rect x="828" y="94" width="36" height="36" rx="10" fill="url(#badge)"/>
    <text x="846" y="117" class="mono" font-size="15" font-weight="700" text-anchor="middle" fill="#16121f">c</text>

    <text x="878" y="108" class="sans" font-size="15" font-weight="600" fill="#f5f4fa">numpy-2.2.6-cp310-win_amd64.whl</text>
    <text x="878" y="127" class="mono" font-size="12" fill="#a9a6bd">4.14 MB / 12.9 MB</text>
    <path d="M1170 96l14 14M1184 96l-14 14" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="1170" y="94" width="20" height="20" rx="6" fill="transparent"/>

    <rect x="828" y="150" width="366" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="828" y="150" width="118" height="7" rx="3.5" fill="url(#bar)"/>
    <rect x="828" y="150" width="118" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.25"/>

    <text x="828" y="184" class="mono" font-size="12" fill="#cfcbdd">32% · curl</text>
    <text x="1194" y="184" class="mono" font-size="12" text-anchor="end" fill="#8f8ca4">148 KB/s · 剩 59s · 40s</text>

    <text x="828" y="214" class="mono" font-size="11" fill="#7f7b98">/plugin/dsh-download-dock/state · 600 ms poll</text>
    <text x="828" y="234" class="mono" font-size="11" fill="#7f7b98">host sampler 700 ms · disk delta + content-length</text>

    <g stroke="#22d3ee" stroke-opacity="0.25" fill="none">
      <path d="M1196 246v22"/>
      <circle cx="1196" cy="272" r="4"/>
    </g>
  </g>
</svg>
